  </defs><style>.eyes{transform-box:fill-box;transform-origin:center;animation:blink 6.2s linear infinite}@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.05)}}/* V3 artwork: each gesture uses a local joint nested inside the placement.
   Rotation never overwrites the SVG translation or scale. */
.farmer-head,.buyer-head,.driver-head{transform-origin:0 35px;animation:character-look 7s ease-in-out infinite}
.buyer-head{animation-name:buyer-look;animation-duration:8s}
.driver-head{animation-name:driver-look;animation-duration:8.5s}
.farmer-torso{transform-origin:253px 348px;animation:farmer-breathe 6s ease-in-out infinite}
.buyer-torso{transform-origin:475px 352px;animation:buyer-breathe 7s ease-in-out infinite}
.driver-body{transform-origin:169px 332px;animation:buyer-breathe 6.8s ease-in-out infinite}
.farmer-arm{transform-origin:0 0;animation:welcome-arm 6s cubic-bezier(.45,0,.25,1) infinite}
.farmer-hand{transform-origin:6px 10px;animation:welcome-hand 6s ease-in-out infinite}
.buyer-phone{transform-origin:0 0;animation:phone-gesture 8s ease-in-out infinite}
.buyer-arm{transform-origin:0 0;animation:resting-arm 7s ease-in-out infinite}
.driver-gesture{transform-origin:193px 250px;animation:driver-gesture 8.5s ease-in-out infinite}
.eyes{animation-duration:6.2s}.buyer .eyes{animation-delay:1.7s}.depot-person .eyes{animation-delay:3.1s}
.plant-sway{animation-duration:7s}.connection-pin{animation:none}
.cloud-one{animation-duration:15s}
.art-label{font:800 12px "Trebuchet MS",Arial,sans-serif;letter-spacing:2.2px}
.depot-station .place-label{left:16%;top:12%;font-size:10px;transform:rotate(-5deg)}
.farm-station .place-label{left:12%;top:16%}
.market-station .place-label{left:23%;top:13%}
.route-layer #road-soft{opacity:.45}.route-layer #road-base{stroke:#d7dfbd}.route-layer #road-travelled{stroke:#a4ba85;opacity:.5}
.place-label{font-weight:400;letter-spacing:.1px;color:#536d4d}
.is-loaded .farmer-hand{animation-duration:4.8s}
.is-delivered .buyer-head{animation-name:buyer-welcome}
.portrait{box-shadow:inset 0 0 0 1px #174d3808}
.art-paused .static-truck .truck-svg{overflow:visible}
@keyframes character-look{0%,14%,72%,100%{transform:rotate(-2deg)}28%,53%{transform:rotate(3deg)}42%{transform:rotate(1deg)}}
@keyframes buyer-look{0%,15%,90%,100%{transform:rotate(-3deg)}35%,60%{transform:rotate(-9deg)}74%{transform:rotate(1deg)}}
@keyframes buyer-welcome{0%,100%{transform:rotate(-2deg)}40%,65%{transform:rotate(3deg)}}
@keyframes driver-look{0%,100%{transform:rotate(-3deg)}38%,65%{transform:rotate(4deg)}}
@keyframes farmer-breathe{0%,100%{transform:rotate(-.5deg) scaleY(1)}50%{transform:rotate(.5deg) scaleY(1.009)}}
@keyframes buyer-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes welcome-arm{0%,15%,82%,100%{transform:rotate(3deg)}32%,64%{transform:rotate(-8deg)}45%{transform:rotate(-6deg)}}
@keyframes welcome-hand{0%,20%,78%,100%{transform:rotate(0)}34%{transform:rotate(-15deg)}44%{transform:rotate(8deg)}54%{transform:rotate(-13deg)}64%{transform:rotate(5deg)}}
@keyframes phone-gesture{0%,15%,90%,100%{transform:rotate(0)}35%,60%{transform:rotate(8deg)}74%{transform:rotate(2deg)}}
@keyframes resting-arm{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
@keyframes driver-gesture{0%,15%,85%,100%{transform:rotate(1deg)}40%,60%{transform:rotate(-7deg)}}
@media(max-width:760px){.depot-station .place-label,.place-label{font-size:8px}.route-layer #road-soft{opacity:.3}}
@media(prefers-reduced-motion:reduce){.station-art *{animation:none!important}}

.wordmark{display:inline-flex;line-height:0;letter-spacing:normal}.wordmark svg{display:block;width:168px;height:auto}.header .wordmark{flex-shrink:0}.footer .wordmark svg{width:145px}@media(max-width:760px){.wordmark svg{width:140px}}
</style>
